# Builds the Android APK (and the Windows EXE) on GitHub's servers.
# Push the repo to GitHub -> Actions tab -> "Build GD AutoBot" -> download artifacts.
name: Build GD AutoBot

on:
  push:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Core tests (quick)
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j
          ./build/gdbot_tests --quick

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          ./gradlew --no-daemon assembleDebug assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: GDAutoBot-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release.apk

  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build EXE (MSVC)
        run: |
          cmake -B build-win -A x64 -DGDBOT_TESTS=OFF
          cmake --build build-win --config Release
      - uses: actions/upload-artifact@v4
        with:
          name: GDAutoBot-exe
          path: build-win/Release/GDAutoBot.exe

  release:
    # Puts the newest APK + EXE on the repo's Releases page (tag "latest"),
    # so they can be downloaded directly on the phone.
    needs: [apk, exe]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: art
      - name: Publish "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp art/GDAutoBot-apk/release/app-release.apk GDAutoBot.apk
          cp art/GDAutoBot-exe/GDAutoBot.exe GDAutoBot.exe
          sha256sum GDAutoBot.apk GDAutoBot.exe > SHA256SUMS.txt
          gh release delete latest --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create latest GDAutoBot.apk GDAutoBot.exe SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "GD AutoBot — son derleme" \
            --notes "Otomatik derleme: ${GITHUB_SHA::7}. APK Android 10+ (debug anahtarıyla imzalı), EXE Windows 10/11 x64."
