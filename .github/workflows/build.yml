# Builds the Android APK (and the Windows EXE) on GitHub's servers.
# Push the repo to GitHub -> Actions tab -> "Build GD AutoBot" -> download artifacts.
name: Build GD AutoBot

on:
  push:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Core tests (quick)
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j
          ./build/gdbot_tests --quick

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          ./gradlew --no-daemon assembleDebug assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: GDAutoBot-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release.apk

  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build EXE (MSVC)
        run: |
          cmake -B build-win -A x64 -DGDBOT_TESTS=OFF
          cmake --build build-win --config Release
      - uses: actions/upload-artifact@v4
        with:
          name: GDAutoBot-exe
          path: build-win/Release/GDAutoBot.exe
